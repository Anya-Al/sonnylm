<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SonnyLM — Chat with a Cat</title>
<!-- onnxruntime-web (WASM) — pinned for stability -->
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
<style>
  :root{
    --bg:#F6EFE4; --bg2:#EFE5D2; --card:#FFFCF6; --ink:#403A33; --soft:#8A8073;
    --line:#EADFCC; --accent:#E8924E; --accent-d:#CC7430; --sonny:#F2EDE6; --sonny-br:#E6DBC9;
    --ok:#3FB68F; --warn:#E6A23C;
    font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px;
    background:radial-gradient(120% 80% at 50% -10%,#FBF5EA,var(--bg) 55%,var(--bg2));color:var(--ink);}
  .app{width:100%;max-width:540px;display:flex;flex-direction:column;height:min(88dvh,760px);
    background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;
    box-shadow:0 18px 44px -20px rgba(80,60,30,.5);}

  header{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);}
  .avatar{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;
    font-size:26px;background:linear-gradient(160deg,#F7B27A,var(--accent));box-shadow:inset 0 1px 0 rgba(255,255,255,.4);}
  .avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;}
  .hwrap{min-width:0;flex:1;}
  .hname{font-weight:800;font-size:18px;line-height:1.1;}
  .hsub{font-size:12px;color:var(--soft);font-weight:700;display:flex;align-items:center;gap:6px;margin-top:2px;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none;}
  .dot.ready{background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 2.4s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,182,143,.4);}70%{box-shadow:0 0 0 7px rgba(63,182,143,0);}100%{box-shadow:0 0 0 0 rgba(63,182,143,0);}}

  .msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;}
  .row{display:flex;gap:8px;max-width:88%;}
  .row.me{align-self:flex-end;flex-direction:row-reverse;}
  .bub{padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-break:break-word;}
  .row.me .bub{background:linear-gradient(180deg,#F0A368,var(--accent));color:#fff;border-bottom-right-radius:5px;}
  .row.sonny .bub{background:var(--sonny);border:1px solid var(--sonny-br);border-bottom-left-radius:5px;}
  .mini{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:16px;
    background:linear-gradient(160deg,#F7B27A,var(--accent));align-self:flex-end;}
  .me .mini{background:#E7DECF;}
  .typing{display:inline-flex;gap:4px;padding:4px 2px;}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--soft);animation:bounce 1.2s infinite;}
  .typing i:nth-child(2){animation-delay:.15s;} .typing i:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5;}30%{transform:translateY(-5px);opacity:1;}}

  .chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px 8px;}
  .chip{border:1px solid var(--sonny-br);background:var(--card);color:var(--ink);font-family:inherit;
    font-weight:700;font-size:13px;padding:8px 12px;border-radius:999px;cursor:pointer;transition:.15s;}
  .chip:hover{border-color:var(--accent);color:var(--accent-d);}
  .chip:disabled{opacity:.45;cursor:default;}

  .composer{display:flex;gap:10px;padding:14px 16px;border-top:1px solid var(--line);align-items:center;}
  #inp{flex:1;font-family:inherit;font-size:15px;font-weight:600;color:var(--ink);background:var(--bg);
    border:1px solid var(--line);border-radius:14px;padding:12px 14px;outline:none;}
  #inp:focus{border-color:var(--accent);}
  #send{flex:none;border:none;border-radius:14px;width:48px;height:46px;cursor:pointer;font-size:18px;color:#fff;
    background:linear-gradient(180deg,#F0A368,var(--accent));box-shadow:0 6px 14px -6px rgba(204,116,48,.7);transition:.1s;}
  #send:active{transform:translateY(2px);}
  #send:disabled{opacity:.5;cursor:default;}
  .temp{display:flex;align-items:center;gap:8px;padding:0 18px 12px;font-size:11.5px;color:var(--soft);font-weight:700;}
  .temp input{flex:1;accent-color:var(--accent);}
  .err{margin:0 18px 12px;padding:10px 14px;border-radius:12px;background:#FDECE9;color:#B5402C;font-size:13px;font-weight:700;display:none;}
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="avatar"><img id="ava" alt="" onerror="this.replaceWith(document.createTextNode('🐈'))" src="sonny.png">🐈</div>
      <div class="hwrap">
        <div class="hname">Sonny</div>
        <div class="hsub"><span class="dot" id="statusDot"></span><span id="statusText">loading…</span></div>
      </div>
    </header>

    <div class="err" id="err"></div>
    <div class="msgs" id="msgs"></div>

    <div class="chips" id="chips"></div>

    <div class="temp">
      <span>chill 🛋️</span>
      <input type="range" id="temp" min="0.2" max="1.2" step="0.05" value="0.7">
      <span>chaos 😼</span>
    </div>

    <div class="composer">
      <input id="inp" type="text" placeholder="say something to Sonny…" autocomplete="off" disabled>
      <button id="send" disabled title="send">➤</button>
    </div>
  </div>

<script type="module">
// ============================================================
//  CONFIG — point these at your files.
//  Same-folder by default (drop model.onnx + tokenizer.json next to this file).
//  Or use your Hugging Face model repo, e.g.:
//    "https://huggingface.co/AnyaAl/sonnylm-9M/resolve/main/model.onnx"
// ============================================================
const MODEL_URL     = "./model.onnx";
const TOKENIZER_URL = "./tokenizer.json";
const MAX_CTX = 128;        // model context window
const MAX_NEW = 64;         // max tokens to generate per reply
const TOP_K   = 40;

// ---------- byte-level BPE tokenizer (validated to match HF `tokenizers`) ----------
function bytesToUnicode(){
  const bs=[]; for(let i=33;i<=126;i++)bs.push(i); for(let i=161;i<=172;i++)bs.push(i); for(let i=174;i<=255;i++)bs.push(i);
  const cs=bs.slice(); let n=0;
  for(let b=0;b<256;b++){ if(!bs.includes(b)){ bs.push(b); cs.push(256+n); n++; } }
  const be={}, bd={};
  for(let i=0;i<bs.length;i++){ const ch=String.fromCharCode(cs[i]); be[bs[i]]=ch; bd[ch]=bs[i]; }
  return {be,bd};
}
const PRE_RE=/'s|'t|'re|'ve|'m|'ll|'d| ?\p{L}+| ?\p{N}+| ?[^\s\p{L}\p{N}]+|\s+(?!\S)|\s+/gu;

function createTokenizer(j){
  const {be,bd}=bytesToUnicode(); const enc=new TextEncoder(), dec=new TextDecoder("utf-8");
  const vocab=j.model.vocab, idTok={}; for(const t in vocab) idTok[vocab[t]]=t;
  const ranks=new Map(); j.model.merges.forEach((m,i)=>ranks.set(Array.isArray(m)?m[0]+" "+m[1]:m,i));
  const added=j.added_tokens||[], sp={}, spIds=new Set();
  for(const t of added){ sp[t.content]=t.id; spIds.add(t.id); }
  const byLen=added.map(t=>t.content).sort((a,b)=>b.length-a.length);
  function bpe(sym){
    if(sym.length<2) return sym;
    while(true){
      let mr=Infinity,pair=null;
      for(let i=0;i<sym.length-1;i++){ const r=ranks.get(sym[i]+" "+sym[i+1]); if(r!==undefined&&r<mr){mr=r;pair=[sym[i],sym[i+1]];} }
      if(!pair) break;
      const out=[]; for(let i=0;i<sym.length;){ if(i<sym.length-1&&sym[i]===pair[0]&&sym[i+1]===pair[1]){out.push(pair[0]+pair[1]);i+=2;}else{out.push(sym[i]);i++;} }
      sym=out; if(sym.length<2) break;
    }
    return sym;
  }
  function chunk(text,ids){
    for(const piece of (text.match(PRE_RE)||[])){
      let w=""; for(const b of enc.encode(piece)) w+=be[b];
      for(const tok of bpe(w.split(""))){ const id=vocab[tok]; if(id!==undefined) ids.push(id); }
    }
  }
  function encode(text){
    const ids=[]; let i=0;
    while(i<text.length){
      let hit=null; for(const s of byLen){ if(s&&text.startsWith(s,i)){hit=s;break;} }
      if(hit){ ids.push(sp[hit]); i+=hit.length; continue; }
      let next=text.length; for(const s of byLen){ if(!s)continue; const k=text.indexOf(s,i); if(k!==-1&&k<next)next=k; }
      chunk(text.slice(i,next),ids); i=next;
    }
    return ids;
  }
  function decode(ids,skip=true){
    let s=""; for(const id of ids){ if(skip&&spIds.has(id))continue; const t=idTok[id]; if(t!==undefined)s+=t; }
    const bytes=[]; for(const ch of s){ const b=bd[ch]; if(b!==undefined)bytes.push(b); }
    return dec.decode(new Uint8Array(bytes));
  }
  return {encode,decode,spIds};
}

// ---------- model loading + generation ----------
let tk=null, session=null, eosId=2;

ort.env.wasm.numThreads = 1;   // GitHub Pages has no cross-origin isolation -> single-threaded WASM
ort.env.wasm.simd = true;
ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/";

const $ = s => document.querySelector(s);
const msgs=$("#msgs"), dot=$("#statusDot"), statusText=$("#statusText"), inp=$("#inp"), send=$("#send"), errBox=$("#err");

function setStatus(t,ready){ statusText.textContent=t; if(ready) dot.classList.add("ready"); }
function showError(t){ errBox.textContent=t; errBox.style.display="block"; }

function addMsg(who,text){
  const row=document.createElement("div"); row.className="row "+(who==="me"?"me":"sonny");
  const mini=document.createElement("div"); mini.className="mini"; mini.textContent=who==="me"?"🙂":"🐈";
  const bub=document.createElement("div"); bub.className="bub";
  if(text===null){ bub.innerHTML='<span class="typing"><i></i><i></i><i></i></span>'; } else { bub.textContent=text; }
  row.appendChild(mini); row.appendChild(bub); msgs.appendChild(row);
  msgs.scrollTop=msgs.scrollHeight;
  return bub;
}

function sampleNext(logits,temp){
  const t=Math.max(temp,1e-6); const n=logits.length; const l=new Float64Array(n);
  for(let i=0;i<n;i++) l[i]=logits[i]/t;
  if(TOP_K>0&&TOP_K<n){
    const kth=Array.from(l).sort((a,b)=>b-a)[TOP_K-1];
    for(let i=0;i<n;i++) if(l[i]<kth) l[i]=-Infinity;
  }
  let mx=-Infinity; for(let i=0;i<n;i++) if(l[i]>mx)mx=l[i];
  let sum=0; for(let i=0;i<n;i++){ l[i]=Math.exp(l[i]-mx); sum+=l[i]; }
  let r=Math.random()*sum, acc=0;
  for(let i=0;i<n;i++){ acc+=l[i]; if(r<=acc) return i; }
  return n-1;
}

async function generate(userText){
  const prompt=`<|im_start|>user\n${userText}<|im_end|>\n<|im_start|>assistant\n`;
  let ids=tk.encode(prompt); const promptLen=ids.length;
  const temp=parseFloat($("#temp").value);
  const inName=session.inputNames[0], outName=session.outputNames[0];
  const bub=addMsg("sonny",null); let firstTok=true;

  for(let step=0;step<MAX_NEW;step++){
    const ctx=ids.slice(-MAX_CTX);
    const tensor=new ort.Tensor("int64", BigInt64Array.from(ctx.map(v=>BigInt(v))), [1,ctx.length]);
    let results;
    try{ results=await session.run({[inName]:tensor}); }
    catch(e){ console.error(e); bub.textContent="(something went wrong running the model)"; return; }
    const out=results[outName]; const data=out.data; const vocab=out.dims[2], seq=out.dims[1];
    const start=(seq-1)*vocab;
    const last=data.subarray ? data.subarray(start,start+vocab) : Array.from(data).slice(start,start+vocab);
    const nextId=sampleNext(last,temp);
    if(nextId===eosId) break;
    ids.push(nextId);
    if(firstTok){ bub.textContent=""; firstTok=false; }
    bub.textContent=tk.decode(ids.slice(promptLen)).trimStart();
    msgs.scrollTop=msgs.scrollHeight;
  }
  if(firstTok) bub.textContent="…"; // produced nothing
}

let busy=false;
async function handleSend(text){
  text=(text||inp.value).trim(); if(!text||busy||!session) return;
  busy=true; inp.value=""; send.disabled=true; inp.disabled=true;
  document.querySelectorAll(".chip").forEach(c=>c.disabled=true);
  addMsg("me",text);
  try{ await generate(text); } finally {
    busy=false; send.disabled=false; inp.disabled=false; inp.focus();
    document.querySelectorAll(".chip").forEach(c=>c.disabled=false);
  }
}

// ---------- suggestion chips ----------
const SUGGESTIONS=["can i pick you up","do you love mom","do you want tuna","you love the laundry",
  "why are you so lazy","the vacuum is coming","goodnight sonny"];
const chipsEl=$("#chips");
SUGGESTIONS.forEach(s=>{
  const b=document.createElement("button"); b.className="chip"; b.textContent=s; b.disabled=true;
  b.onclick=()=>handleSend(s); chipsEl.appendChild(b);
});

send.onclick=()=>handleSend();
inp.addEventListener("keydown",e=>{ if(e.key==="Enter") handleSend(); });

// ---------- boot ----------
(async function boot(){
  try{
    setStatus("downloading tokenizer…");
    const tkJSON=await (await fetch(TOKENIZER_URL)).json();
    tk=createTokenizer(tkJSON);
    const eos=(tkJSON.added_tokens||[]).find(t=>t.content==="<|im_end|>");
    if(eos) eosId=eos.id;

    setStatus("downloading model (~9 MB)…");
    session=await ort.InferenceSession.create(MODEL_URL,{executionProviders:["wasm"]});

    setStatus("8.7M params · running locally in your browser", true);
    inp.disabled=false; send.disabled=false;
    document.querySelectorAll(".chip").forEach(c=>c.disabled=false);
    addMsg("sonny","oh. you. not mom. this better be about food. ask me something.");
    inp.focus();
  }catch(e){
    console.error(e);
    setStatus("failed to load");
    showError("Couldn't load the model. Make sure model.onnx and tokenizer.json are in this folder — train on Colab first, then add them here.");
  }
})();
</script>
</body>
</html>
